[package]
name = "display_switcher"
version = "0.1.0"
edition = "2024"
description = "Windowsのディスプレイ設定をコマンドラインから瞬時に切り替えるツール"
repository = "https://github.com/YutoK-JP/display-switcher"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
